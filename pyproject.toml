[project]
name = "paris-baguette-payroll"
version = "0.1.0"
description = "Single-store attendance and payroll automation web app (kiosk + manager console)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "openpyxl>=3.1",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.6",
    "basedpyright>=1.18",
    "pip-audit>=2.7",
    "django-stubs[compatible-mypy]>=5.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]
extend-exclude = [".uvcache", "assets/vendor", "staticfiles", "node_modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S", "C4", "SIM"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"config/settings/*" = ["F403", "F405"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["config", "apps", "tests"]
exclude = ["**/migrations/**", "**/node_modules/**", ".venv", ".uvcache", "staticfiles", "assets/vendor"]
reportMissingTypeStubs = false

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="파리바게뜨 매장 급여 운영 워크스페이스" />
  <title>파리바게뜨 인사·급여</title>
  <link rel="stylesheet" href="/assets/styles/tokens.css" />
  <link rel="stylesheet" href="/assets/styles/app.css" />
  <link rel="stylesheet" href="/assets/styles/home.css" />
</head>
<body class="pb-home-body">
  <a class="pb-skip-link" href="#main-content">본문으로 바로가기</a>

  <div class="pb-landing">
    <header class="pb-landing__header">
      <a class="pb-brand" href="/" aria-label="파리바게뜨 인사·급여 홈">
        <span class="pb-brand__mark" aria-hidden="true">PB</span>
        <span>
          <strong>Paris Baguette</strong>
          <small>People operations</small>
        </span>
      </a>
      <span class="pb-chip">매장 운영 워크스페이스</span>
    </header>

    <main id="main-content" class="pb-landing__main">
      <section class="pb-landing__hero" aria-labelledby="landing-title">
        <div class="pb-landing__hero-copy">
          <p class="pb-eyebrow">Payroll · People Ops</p>
          <h1 id="landing-title">급여와 인사 운영을<br />한곳에.</h1>
          <p class="pb-landing__lead">
            직원 정보부터 급여 준비와 마감까지,
            매니저가 필요한 업무를 한 화면에서 차분하게 확인합니다.
          </p>
        </div>
        <figure class="pb-landing__visual">
          <img
            src="/assets/images/illustrations/bakery-operations.webp"
            width="1200"
            height="900"
            alt="급여 문서와 달력, 계산기가 놓인 베이커리 매장 운영대"
            fetchpriority="high"
            decoding="async"
          />
        </figure>
      </section>

      <section class="pb-entry-grid" aria-label="업무 화면 선택">
        <a class="pb-entry-card pb-entry-card--manager" href="/manager/console/">
          <span class="pb-entry-card__visual">
            <img
              src="/assets/images/illustrations/manager-payroll.webp"
              width="760"
              height="701"
              alt="급여 문서와 달력, 계산기가 정돈된 매니저 업무대"
              decoding="async"
            />
          </span>
          <span class="pb-entry-card__content">
            <span class="pb-entry-card__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                <path d="M7 9h3v7H7zM14 7h3v9h-3z"></path>
              </svg>
            </span>
            <span class="pb-entry-card__eyebrow">관리자용</span>
            <strong>매니저 콘솔</strong>
            <span class="pb-entry-card__copy">급여 미리보기, 보험 대사와 마감 흐름을 확인합니다.</span>
            <span class="pb-entry-card__cta">
              콘솔 열기
              <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path d="M4 10h11M11 6l4 4-4 4"></path>
              </svg>
            </span>
          </span>
        </a>
      </section>
    </main>

    <footer class="pb-landing__footer">
      <span>매장 인사·급여 운영</span>
      <span aria-hidden="true">·</span>
      <span>안전한 내부 시스템</span>
    </footer>
  </div>
</body>
</html>

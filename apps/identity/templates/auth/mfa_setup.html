<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2단계 인증 설정</title>
  <link rel="stylesheet" href="/assets/styles/tokens.css" />
  <link rel="stylesheet" href="/assets/styles/app.css" />
</head>
<body>
  <main class="pb-page">
    <h1>2단계 인증 설정</h1>
    <p>Google Authenticator, Microsoft Authenticator 같은 인증 앱에서 아래 키를 등록해 주세요.</p>
    <p><strong>{{ secret }}</strong></p>
    <p><a href="{{ provisioning_uri }}">인증 앱으로 열기</a></p>
    {% if error %}<p class="pb-status pb-status--error" role="alert"><span class="pb-status__dot"></span>{{ error }}</p>{% endif %}
    <form method="post" action="{% url 'auth:mfa_setup' %}">
      {% csrf_token %}
      <label class="pb-field">
        <span>앱에 표시된 6자리 코드</span>
        <input class="pb-input" name="token" inputmode="numeric" autocomplete="one-time-code" required />
      </label>
      <button class="pb-btn" type="submit">설정 완료하고 로그인</button>
    </form>
  </main>
</body>
</html>

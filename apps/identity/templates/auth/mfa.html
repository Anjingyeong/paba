<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2단계 인증</title>
  <link rel="stylesheet" href="/assets/styles/tokens.css" />
  <link rel="stylesheet" href="/assets/styles/app.css" />
</head>
<body>
  <main class="pb-page">
    <h1>인증 코드 입력</h1>
    {% if error %}<p class="pb-status pb-status--error" role="alert"><span class="pb-status__dot"></span>{{ error }}</p>{% endif %}
    <form method="post" action="{% url 'auth:mfa' %}">
      {% csrf_token %}
      <label class="pb-field">
        <span>인증 코드</span>
        <input class="pb-input" name="token" inputmode="numeric" autocomplete="one-time-code" required />
      </label>
      <button class="pb-btn" type="submit">로그인</button>
    </form>
  </main>
</body>
</html>

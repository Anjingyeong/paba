<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>2단계 인증</title></head>
<body>
  <main>
    <h1>인증 코드 입력</h1>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{% url 'auth:mfa' %}">
      {% csrf_token %}
      <label>인증 코드 <input name="token" inputmode="numeric" autocomplete="one-time-code"></label>
      <button type="submit">로그인</button>
    </form>
  </main>
</body>
</html>
